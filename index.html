<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asilbek | Restaurant</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/fonts.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="main__header">
      <div class="container">
        <div class="main__header-wrapper">
          <p class="main__header-text">
            SUNDAY - THURSDAY: 11:30AM - 11PM | FRIDAY & SATURDAY: 11:30AM -
            12AM
          </p>

          <div class="user__actions">
            <div class="user__action">
              <img src="./assets/icons/vector.svg" alt="profile" />
              <span>Account</span>
            </div>
            <div class="user__action">
              <img src="./assets/icons/pencil.svg" alt="Pencil" />
              <span>My order</span>
            </div>
          </div>
        </div>
      </div>
    </header>
    <!-- /Header -->

    <!-- Banner -->
    <section class="main__banner">
      <div class="container">
        <div class="main__banner-wrapper">
          <div class="main__banner-navigation">
            <div class="banner__image">
              <img src="./assets/images/banner.svg" alt="Banner image" />
            </div>
            <ul class="menu__items">
              <li class="menu__item">
                <a href="#" class="menu__item-link">Menu</a>
              </li>
              <li class="menu__item">
                <a href="#" class="menu__item-link">Events</a>
              </li>
              <li class="menu__item">
                <a href="#" class="menu__item-link">About Us</a>
              </li>
              <li class="menu__item">
                <a href="#" class="menu__item-link">Reservation</a>
              </li>
              <li class="menu__item">
                <a href="#" class="menu__item-link">Order</a>
              </li>
              <li class="menu__item">
                <a href="#" class="menu__item-link">Contact Us</a>
              </li>
            </ul>
          </div>
          <div class="banner__text">
            <h2 class="banner__title">
              Welcome to our <span>Yours Foods</span> Restaurant
            </h2>
            <p class="banner__description">
              Bringing delicious moments to your table. <br />
              Savor the joy of fresh and flavorful dishes.
            </p>
          </div>
          <div class="buttons">
            <button class="button" type="button">Reserve Now</button>
            <button class="button" type="button">Order Food</button>
          </div>
        </div>
      </div>
    </section>
    <!-- /Banner -->
  </body>
</html>
